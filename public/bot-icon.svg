<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Robot Head -->
  <rect x="20" y="25" width="60" height="50" rx="15" ry="15" fill="currentColor" stroke="none"/>
  
  <!-- Robot Eyes -->
  <circle cx="35" cy="40" r="6" fill="white"/>
  <circle cx="65" cy="40" r="6" fill="white"/>
  <circle cx="35" cy="40" r="3" fill="currentColor"/>
  <circle cx="65" cy="40" r="3" fill="currentColor"/>
  
  <!-- Robot Mouth -->
  <rect x="40" y="55" width="20" height="8" rx="4" ry="4" fill="white"/>
  <rect x="42" y="57" width="4" height="4" rx="1" ry="1" fill="currentColor"/>
  <rect x="48" y="57" width="4" height="4" rx="1" ry="1" fill="currentColor"/>
  <rect x="54" y="57" width="4" height="4" rx="1" ry="1" fill="currentColor"/>
  
  <!-- Robot Antenna -->
  <line x1="50" y1="25" x2="50" y2="15" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="3" fill="currentColor"/>
  
  <!-- Robot Body -->
  <rect x="30" y="75" width="40" height="20" rx="5" ry="5" fill="currentColor" stroke="none"/>
  
  <!-- Robot Arms -->
  <rect x="15" y="78" width="12" height="8" rx="4" ry="4" fill="currentColor"/>
  <rect x="73" y="78" width="12" height="8" rx="4" ry="4" fill="currentColor"/>
  
  <!-- Robot Body Details -->
  <circle cx="45" cy="82" r="2" fill="white"/>
  <circle cx="55" cy="82" r="2" fill="white"/>
  <rect x="47" y="87" width="6" height="3" rx="1" ry="1" fill="white"/>
</svg>