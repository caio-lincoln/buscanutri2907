name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  CACHE_VERSION: v1

jobs:
  # ✅ Verificações de qualidade de código
  quality-checks:
    name: 🔍 Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧹 Cache cleanup
        run: |
          rm -rf .next
          npm run cache:clear

      - name: 🔧 TypeScript strict check
        run: npm run type-check:strict

      - name: 🔍 ESLint strict check
        run: npm run lint:strict

      - name: 💅 Prettier check
        run: npm run format:check

      - name: 🏗️ Build check
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📊 Bundle analyzer
        run: |
          npm install -g @next/bundle-analyzer
          ANALYZE=true npm run build

  # 🧪 Testes
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: |
          # Adicionar quando tiver testes configurados
          echo "Tests will be added here"
          # npm run test:ci

  # 🚀 Deploy (apenas para main branch)
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [quality-checks, tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🧹 Cache flush (post-deploy)
        run: |
          # Flush do cache do servidor
          curl -X POST "${{ secrets.DEPLOY_URL }}/api/admin/cache-flush" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"action": "all"}' || echo "Cache flush failed"

      - name: 🌐 CDN Purge (Cloudflare)
        if: env.CLOUDFLARE_ZONE_ID != ''
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything": true}' || echo "CDN purge failed"
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: 📊 Deploy notification
        run: |
          echo "🎉 Deploy completed successfully!"
          echo "Build ID: $(cat .next/BUILD_ID 2>/dev/null || echo 'unknown')"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # 🔄 Cron job para limpeza de cache
  cache-maintenance:
    name: 🧹 Cache Maintenance
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: 🧹 Scheduled cache cleanup
        run: |
          # Limpeza de cache agendada
          curl -X POST "${{ secrets.DEPLOY_URL }}/api/admin/cache-flush" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"action": "all"}' || echo "Scheduled cache flush failed"

# 📅 Agendamento para limpeza de cache
on:
  schedule:
    # Todo dia às 2:00 AM UTC
    - cron: '0 2 * * *'